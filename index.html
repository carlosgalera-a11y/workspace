function dateBadge(d){
  const s=String(d||'').slice(0,10); if(!s) return null;
  const today=new Date().toISOString().slice(0,10);
  if(s===today) return ['hoy','bg-[#4edea3]/15 text-[#4edea3]'];
  const diff=Math.round((new Date(s)-new Date(today))/86400000);
  const fmt=new Date(s).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  if(diff<0) return ['venció '+fmt,'bg-[#EF4444]/15 text-[#EF4444]'];
  if(diff<=7) return ['en '+diff+' d','bg-[#131b2e] border border-[#283449] text-[#94A3B8]'];
  return [fmt,'bg-[#131b2e] border border-[#283449] text-[#94A3B8]'];
}

function relTime(iso) {
  if (!iso) return ''; const d = new Date(iso).getTime(); if (isNaN(d)) return '';
  const diff = Date.now()-d, day=86400000;
  if (diff < 3600000) return Math.max(1,Math.round(diff/60000))+' min';
  if (diff < day) return Math.round(diff/3600000)+' h';
  if (diff < 30*day) return Math.round(diff/day)+' d';
  return new Date(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
}

/* ── data (tablas COMPARTIDAS ws_*: RLS de pareja Carlos+Raquel → los dos veis y editáis lo mismo) ── */
const me = () => (state.user && state.user.email) || '';
async function loadAll() {
  const [pr,tk,mt,fi,up] = await Promise.all([
    sb.from('ws_projects').select('*').order('created_at',{ascending:true}),
    sb.from('ws_tasks').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('ws_meetings').select('*').limit(500),
    sb.from('ws_files').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('ws_updates').select('*').order('created_at',{ascending:false}).limit(200),
  ]);
  state.projects = pr.data || [];
  state.tasks = (tk.data||[]).map(t => ({ ...t, category:t.project_id, dueDate:t.due_date }));
  state.events = (mt.data||[]).map(m => ({ id:m.id, title:m.title, date:(m.date||'').slice(0,10), type:'proj:'+m.project_id }));
  state.files = (fi.data||[]).map(f => ({ ...f, folder:((state.projects.find(p=>p.id===f.project_id)||{}).name)||'Workspace', tags:['proj:'+f.project_id] }));
  state.updates = up.data || [];
}
async function loadGithub() {
  state.ghLoading = true; render();
  try {
    const { data, error } = await sb.functions.invoke('github-proxy', { body:{ action:'summary', repo:currentRepo(), limit:10 } });
    if (error) { let d=error.message||'error'; try{const j=await error.context.json();d=j.hint||j.detail||j.error||d;}catch(_){} state.gh={error:d,commits:[],prs:[],issues:[],counts:{}}; }
    else if (data && data.error) state.gh = { error:data.hint||data.detail||data.error, commits:[],prs:[],issues:[],counts:{} };
    else state.gh = data;
  } catch(e){ state.gh = { error:String(e&&e.message||e), commits:[],prs:[],issues:[],counts:{} }; }
  state.ghLoading = false; render();
}
async function addNote(pid) {
  const inp = document.getElementById('note-input'); const sel = document.getElementById('note-kind');
  const note = (inp&&inp.value||'').trim(); if (!note) return;
  const row = { id:'upd-'+uid(), project_id: pid || state.selectedProject || 'general', note, kind: sel?sel.value:'nota', created_by: me(), created_at:new Date().toISOString() };
  state.updates.unshift(row); render();
  try { await sb.from('ws_updates').insert(row); } catch(_){}
}
async function toggleTask(id) {
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.completed=!t.completed; if(t.completed) t.stage=null; render();
  try { await sb.from('ws_tasks').update({completed:t.completed, stage:t.stage}).eq('id',id); } catch(_){}
}
async function setStage(id, target) {
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  if (target==='hecho'){ t.completed=true; t.stage=null; } else { t.completed=false; t.stage=(target==='en_curso'?'en_curso':null); }
  render();
  try { await sb.from('ws_tasks').update({completed:t.completed, stage:t.stage}).eq('id',id); } catch(_){}
}
async function addTask(pid) {
  const inp = document.getElementById('task-input'); const title=(inp&&inp.value||'').trim(); if(!title) return;
  const project_id = pid || state.selectedProject || 'general';
  const row = { id:'task-'+uid(), project_id, title, completed:false, stage:null, priority:'medium', due_date:null, created_by: me(), created_at:new Date().toISOString() };

async function updateProject(id, patch) {
  const p = proj(id); if(!p) return; Object.assign(p,patch); render();

async function addMeeting(pid) {
  const dateEl=document.getElementById('mtg-date'); const titleEl=document.getElementById('mtg-title');

  const row = { id:'evt-'+uid(), project_id:pid, title, date, created_by: me(), created_at:new Date().toISOString() };
  state.events.push({ id:row.id, title, date, type:'proj:'+pid }); render();
  try { await sb.from('ws_meetings').insert(row); } catch(e){ alert('No se pudo guardar la reunión: '+(e&&e.message||e)); }
}
function pickFile(pid) {

async function uploadFile(pid, file) {
  state.uploading=true; render();
  try {
    const ext=(file.name.split('.').pop()||'bin').toLowerCase();
    const path='workspace/'+Math.random().toString(36).slice(2)+'-'+Date.now()+'.'+ext;
    const { error } = await sb.storage.from('files').upload(path, file);
    if (error) throw error;
    const { data } = sb.storage.from('files').getPublicUrl(path);
    const p = proj(pid);
    const row = { id:'file-'+uid(), project_id:pid, name:file.name, url:data.publicUrl, storage_path:path, created_by: me(), created_at:new Date().toISOString() };
    state.files.unshift({ ...row, folder: p?p.name:'Workspace', tags:['proj:'+pid] });
    await sb.from('ws_files').insert(row);
  } catch(e){ alert('Error subiendo el archivo: '+(e&&e.message||e)); }
  state.uploading=false; render();
}

  if(!state.user||state.refreshing) return;

  try{ await loadAll(); }catch(_){}
  state.refreshing=false; render();

/* Re-render preservando el foco/valor del campo que estés escribiendo (para que
   un cambio en vivo no te borre el comentario a medias). */
function renderPreserve(){
  const a=document.activeElement;
  const info = (a && a.id && ('value' in a)) ? { id:a.id, val:a.value, s:a.selectionStart, e:a.selectionEnd } : null;
  render();
  if(info){ const el=document.getElementById(info.id); if(el){ try{ el.value=info.val; el.focus(); if(info.s!=null&&el.setSelectionRange) el.setSelectionRange(info.s,info.e); }catch(_){} } }
}
let _liveTimer=null;
function onLiveChange(){ clearTimeout(_liveTimer); _liveTimer=setTimeout(async()=>{ try{ await loadAll(); renderPreserve(); }catch(_){} }, 400); }
async function subscribeRealtime(){
  try {
    if (state._chan || !sb.channel) return;
    // Pasa el token del usuario al canal Realtime para que el RLS de pareja
    // deje pasar los cambios (si no, Realtime iría como anon y no llegaría nada).
    try { const { data:{ session } } = await sb.auth.getSession(); if(session&&session.access_token&&sb.realtime&&sb.realtime.setAuth) sb.realtime.setAuth(session.access_token); } catch(_){}
    let ch = sb.channel('ws-live');
    ['ws_projects','ws_tasks','ws_meetings','ws_updates','ws_files'].forEach(t=>{
      ch = ch.on('postgres_changes', { event:'*', schema:'public', table:t }, onLiveChange);
    });
    ch.subscribe((status)=>{ const was=state._live; state._live = (status==='SUBSCRIBED'); if(state.user && was!==state._live) renderPreserve(); });
    state._chan = ch;
  } catch(_){}
}

function myNotifs(){
  const meE=me(); const today=new Date().toISOString().slice(0,10); const tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);
  const myTasks = state.tasks.filter(t=>!t.completed && t.assignee===meE);
  const soonMtgs = state.events.filter(e=> e.date===today || e.date===tomorrow);
  const teamAct = state.updates.filter(u=>u.created_by && u.created_by!==meE).slice(0,5);
  return { count: myTasks.length + soonMtgs.length, myTasks, soonMtgs, teamAct };
}
function notifPanel(){
  const n=myNotifs(); const pjName=id=>(proj(id)||{}).name||''; const today=new Date().toISOString().slice(0,10);

  const sect=(title,rows)=>rows.length?`<p class="text-[10px] font-semibold text-[#64748b] uppercase tracking-wider px-3 pt-2">${title}</p>${rows.join('')}`:'';
  const tasksR=n.myTasks.map(t=>item('📋',t.title, (t.category&&t.category!=='general'?pjName(t.category)+' · ':'')+(PRIOB[t.priority||'medium']||PRIOB.medium)[0]));
  const mtgR=n.soonMtgs.map(m=>item('📅',m.title, (m.date===today?'hoy':'mañana')+' · '+m.date));
  const teamR=n.teamAct.map(u=>item('🚩',u.note, (TEAM_NAME[u.created_by]||String(u.created_by).split('@')[0])+' · '+relTime(u.created_at)));
  const body = (tasksR.length||mtgR.length||teamR.length) ? `${sect('Para ti', tasksR.concat(mtgR))}${sect('Actividad del equipo', teamR)}` : `<p class="text-sm text-[#64748b] text-center py-6">Sin novedades 🎉</p>`;

function mainContent() {
  if (state.section==='overview') return state.selectedProject ? projectDashboard(proj(state.selectedProject)) : overview();

  if (state.section==='calendario') return `<div class="fh-card rounded-2xl p-5 fh-rise">${calendar()}</div>`;

  if (state.section==='archivos') return `<div class="fh-card rounded-2xl p-5 fh-rise">${archivos()}</div>`;

}

function overview() {
  const active = state.projects.filter(p=>p.status==='active').length;

  const done = state.tasks.filter(t=>t.completed).length;
  const card = (icon,label,val) => `<div class="fh-card rounded-2xl p-4"><div class="flex items-center gap-2 mb-2"><span>${icon}</span><span class="text-xs text-[#94A3B8]">${label}</span></div><p class="text-2xl font-headline font-bold">${val}</p></div>`;
  const pcard = (p) => { const done_=projTasks(p.id).filter(t=>t.completed).length, tot=projTasks(p.id).length, st=STATUS[p.status||'active']||STATUS.active;
    return `<button data-act="proj" data-id="${esc(p.id)}" class="fh-card rounded-2xl p-4 text-left hover:border-[#4edea3]/50 transition-colors">
      <div class="flex items-center justify-between mb-2"><span class="font-headline font-bold text-sm truncate">${esc(p.name)}</span><span class="text-[9px] px-2 py-0.5 rounded-full ${st[1]}">${st[0]}</span></div>
      <div class="flex items-center gap-2"><div class="flex-1 h-1.5 rounded-full bg-[#283449] overflow-hidden"><div class="h-full bg-[#8083ff]" style="width:${Math.max(0,Math.min(100,p.progress||0))}%"></div></div><span class="text-[10px] text-[#64748b]">${p.progress||0}%</span></div>
      <p class="text-[10px] text-[#64748b] mt-2">${done_}/${tot} tareas · ${projMeetings(p.id).length} reuniones</p>

  return `<div class="space-y-6 fh-rise">

    <div><p class="text-xs font-semibold text-[#64748b] uppercase tracking-wider mb-3">Tus proyectos</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${state.projects.map(pcard).join('')||'<p class="text-sm text-[#64748b]">Sin proyectos</p>'}</div></div>
    <div class="fh-card rounded-2xl p-5">${calendar()}</div>
  </div>`;
}

      <div class="flex flex-col sm:flex-row gap-2 mb-4">

          <button data-act="add-note" data-id="${esc(p.id)}" class="ml-auto px-4 py-2 rounded-lg bg-[#8083ff] text-white text-sm font-semibold hover:bg-[#6d70e6]">Publicar</button>

      <div class="space-y-1.5">${fls.map(f=>`<a href="${esc(f.url||'#')}" target="_blank" rel="noopener" class="flex items-center gap-3 py-2.5 px-3 rounded-xl hover:bg-[#1c2436]"><span class="w-8 h-8 rounded-lg bg-[#8083ff]/15 flex items-center justify-center">📄</span><div class="flex-1 min-w-0"><p class="text-sm truncate">${esc(f.name)}</p><p class="text-[10px] text-[#64748b]">${f.date||''}</p></div><span class="text-[#64748b]">↗</span></a>`).join('') || '<p class="text-sm text-[#64748b] text-center py-4">Sin archivos — pulsa «Subir»</p>'}</div>

function taskCard(t) {
  const stg = taskStage(t);
  const moves = stg==='pendiente' ? [['en_curso','▶'],['hecho','✓']] : stg==='en_curso' ? [['pendiente','◀'],['hecho','✓']] : [['pendiente','↺']];
  const scope=t.scope||'comun';
  const tipo = scope==='individual' ? ['individual','bg-[#64748b]/20 text-[#94A3B8]'] : ['común','bg-[#4edea3]/15 text-[#4edea3]'];
  const who = t.assignee ? (TEAM_NAME[t.assignee]||String(t.assignee).split('@')[0]) : '';
  const pr = PRIOB[t.priority||'medium']||PRIOB.medium;
  return `<div class="rounded-lg bg-[#0d1528] p-2.5 ${stg==='hecho'?'opacity-60':''}">
    <div class="flex items-start gap-2">
      <span class="text-sm flex-1 min-w-0 ${stg==='hecho'?'line-through text-[#64748b]':''}">${esc(t.title)}</span>
      <div class="flex gap-1 shrink-0">${moves.map(([tg,ic])=>`<button data-act="stage" data-id="${esc(t.id)}" data-stage="${tg}" class="w-6 h-6 rounded-md bg-[#1c2436] text-[#94A3B8] hover:text-[#F8FAFC] text-xs">${ic}</button>`).join('')}</div>
    </div>
    <div class="flex items-center gap-1 flex-wrap mt-1.5">
      <span class="text-[9px] px-1.5 py-0.5 rounded-full ${tipo[1]}">${tipo[0]}</span>
      ${who?`<span class="text-[9px] px-1.5 py-0.5 rounded-full bg-[#131b2e] border border-[#283449] text-[#94A3B8]">👤 ${esc(who)}</span>`:''}
      <span class="text-[9px] px-1.5 py-0.5 rounded-full ${pr[1]}">${pr[0]}</span>
    </div>
  </div>`;
}

function calendar() {
  const { m,y } = state.cal;
  const total=new Date(y,m+1,0).getDate(), offset=(new Date(y,m,1).getDay()+6)%7;
  const today=`${new Date().getFullYear()}-${pad(new Date().getMonth()+1)}-${pad(new Date().getDate())}`;
  const byDay={}; state.events.forEach(e=>{ if(e.date)(byDay[e.date]=byDay[e.date]||[]).push(e); });
  let cells=''; for(let i=0;i<offset;i++) cells+='<div></div>';
  for(let d=1;d<=total;d++){ const ds=`${y}-${pad(m+1)}-${pad(d)}`, evs=byDay[ds]||[], isT=ds===today;
    cells+=`<div class="min-h-[64px] p-1.5 rounded-lg border ${isT?'border-[#8083ff] bg-[#8083ff]/10':'border-[#283449]/50'}"><span class="text-xs font-semibold ${isT?'text-[#8083ff]':'text-[#94A3B8]'}">${d}</span>${evs.slice(0,2).map(e=>`<div class="mt-0.5 text-[10px] leading-tight truncate px-1 py-0.5 rounded bg-[#4edea3]/15 text-[#4edea3]">${esc(e.title)}</div>`).join('')}${evs.length>2?`<span class="text-[9px] text-[#64748b]">+${evs.length-2}</span>`:''}</div>`; }
  return `<div class="flex items-center justify-between mb-4"><button data-act="cal-prev" class="p-1.5 rounded-lg hover:bg-[#1c2436] text-[#94A3B8]">‹</button><h3 class="font-headline font-bold">${MONTHS[m]} ${y}</h3><button data-act="cal-next" class="p-1.5 rounded-lg hover:bg-[#1c2436] text-[#94A3B8]">›</button></div>
    <div class="grid grid-cols-7 gap-0.5 mb-1">${DAYS.map(d=>`<div class="text-center text-[10px] font-semibold text-[#64748b] py-1">${d}</div>`).join('')}</div>
    <div class="grid grid-cols-7 gap-1">${cells}</div>
    <p class="text-[10px] text-[#64748b] mt-3 text-center">Las reuniones de tus proyectos aparecen aquí y en <a href="${CAL_URL}" target="_blank" rel="noopener" class="text-[#8083ff] underline">tu calendario ↗</a></p>`;
}

  const asOpts = ['<option value="">Sin asignar</option>'].concat(TEAM.map(m=>`<option value="${esc(m.email)}">${esc(m.name)}</option>`)).join('');

    <select id="task-proj" class="${selCls}">${pjOpts}</select>
    <select id="task-assignee" class="${selCls}">${asOpts}</select>
    <input id="task-date" type="date" class="${selCls}" />
    <select id="task-prio" class="${selCls}"><option value="medium">Media</option><option value="high">Alta</option><option value="urgent">Urgente</option><option value="low">Baja</option></select>
    <button data-act="add-task2" class="px-4 py-2 rounded-lg bg-[#4edea3] text-[#0b1326] text-sm font-semibold">Añadir</button>
  </div>`;
}
function taskRow(t){
  const scope=t.scope||'comun';
  const tipo = scope==='individual' ? ['individual','bg-[#64748b]/20 text-[#94A3B8]'] : ['común','bg-[#4edea3]/15 text-[#4edea3]'];
  const pj = (t.category && t.category!=='general') ? ((proj(t.category)||{}).name||'') : '';
  const who = t.assignee ? (TEAM_NAME[t.assignee]||String(t.assignee).split('@')[0]) : '';
  const pr = PRIOB[t.priority||'medium']||PRIOB.medium;
  const db = dateBadge(t.dueDate);
  return `<div class="fh-card rounded-xl p-3 flex items-start gap-3 ${t.completed?'opacity-60':''}">
    <button data-act="toggle-task" data-id="${esc(t.id)}" class="mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center shrink-0 ${t.completed?'bg-[#4edea3] border-[#4edea3]':'border-[#334155]'}">${t.completed?'<span class="text-[#0b1326] text-xs">✓</span>':''}</button>
    <div class="flex-1 min-w-0">
      <p class="text-sm ${t.completed?'line-through text-[#64748b]':'text-[#F8FAFC]'}">${esc(t.title)}</p>
      <div class="flex items-center gap-1.5 flex-wrap mt-1.5">
        <span class="text-[9px] px-1.5 py-0.5 rounded-full ${tipo[1]}">${tipo[0]}</span>
        ${who?`<span class="text-[9px] px-1.5 py-0.5 rounded-full bg-[#131b2e] border border-[#283449] text-[#94A3B8]">👤 ${esc(who)}</span>`:''}
        ${pj?`<span class="text-[9px] px-1.5 py-0.5 rounded-full bg-[#8083ff]/10 text-[#c0c1ff]">${esc(pj)}</span>`:''}
        ${db?`<span class="text-[9px] px-1.5 py-0.5 rounded-full ${db[1]}">📅 ${esc(db[0])}</span>`:''}
        <span class="text-[9px] px-1.5 py-0.5 rounded-full ${pr[1]}">${pr[0]}</span>
      </div>
    </div>
    <button data-act="del-task" data-id="${esc(t.id)}" class="text-[#64748b] hover:text-[#EF4444] shrink-0 text-sm">🗑</button>
  </div>`;
}
function tareas() {
  const meE = me();
  let ts = state.selectedProject ? projTasks(state.selectedProject) : state.tasks.slice();
  const f = state.taskFilter;
  if (f==='mias') ts = ts.filter(t => t.assignee===meE);
  else if (f==='comunes') ts = ts.filter(t => (t.scope||'comun')==='comun');
  else if (f==='individuales') ts = ts.filter(t => t.scope==='individual');
  else if (f==='proyecto') ts = ts.filter(t => t.category && t.category!=='general');
  if (state.taskDone==='pendientes') ts = ts.filter(t=>!t.completed);
  else if (state.taskDone==='hechas') ts = ts.filter(t=>t.completed);
  const pend = (state.selectedProject?projTasks(state.selectedProject):state.tasks).filter(t=>!t.completed).length;
  const today=new Date().toISOString().slice(0,10);
  const G={venc:[],hoy:[],prox:[],sinf:[]};
  ts.forEach(t=>{ const d=t.dueDate?String(t.dueDate).slice(0,10):''; if(!d)G.sinf.push(t); else if(d<today)G.venc.push(t); else if(d===today)G.hoy.push(t); else G.prox.push(t); });
  const bd=(a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''); G.venc.sort(bd);G.hoy.sort(bd);G.prox.sort(bd);
  const chip=(id,label,on)=>`<button data-act="tfilter" data-id="${id}" class="px-3 py-1.5 rounded-full text-xs font-semibold ${on?'bg-[#8083ff]/20 text-[#c0c1ff] border border-[#8083ff]/40':'text-[#94A3B8] border border-[#283449] hover:text-[#F8FAFC]'}">${label}</button>`;
  const dchip=(id,label,on)=>`<button data-act="tdone" data-id="${id}" class="px-3 py-1.5 rounded-full text-xs font-semibold ${on?'bg-[#4edea3]/20 text-[#4edea3] border border-[#4edea3]/40':'text-[#94A3B8] border border-[#283449] hover:text-[#F8FAFC]'}">${label}</button>`;
  const grp=(title,arr)=>arr.length?`<div class="mb-4"><p class="text-[11px] font-semibold text-[#64748b] uppercase tracking-wider mb-2">${title} (${arr.length})</p><div class="space-y-2">${arr.map(taskRow).join('')}</div></div>`:'';
  return `<div class="flex items-center justify-between mb-3"><h3 class="font-headline font-bold">Tareas <span class="text-xs text-[#64748b] font-normal">· ${pend} pendiente(s)</span></h3></div>
    ${addTaskRow()}
    <div class="flex items-center gap-2 flex-wrap mb-4">
      ${chip('todas','Todas',f==='todas')}${chip('mias','👤 Mías',f==='mias')}${chip('comunes','Comunes',f==='comunes')}${chip('proyecto','De proyecto',f==='proyecto')}${chip('individuales','Individuales',f==='individuales')}
      <span class="ml-auto flex gap-2">${dchip('pendientes','Pendientes',state.taskDone==='pendientes')}${dchip('hechas','Hechas',state.taskDone==='hechas')}${dchip('todas','Todas',state.taskDone==='todas')}</span>
    </div>
    ${grp('Vencidas',G.venc)}${grp('Hoy',G.hoy)}${grp('Próximas',G.prox)}${grp('Sin fecha',G.sinf)}
    ${ts.length===0?'<p class="text-sm text-[#64748b] text-center py-8">Sin tareas con este filtro</p>':''}`;
}
async function addTaskFull(){
  const g=id=>document.getElementById(id);
  const title=((g('task-input')||{}).value||'').trim(); if(!title) return;
  const project_id=((g('task-proj')||{}).value)||'general';
  const row={ id:'task-'+uid(), project_id, title, completed:false, stage:null,
    priority:((g('task-prio')||{}).value)||'medium', due_date:((g('task-date')||{}).value)||null,
    scope:((g('task-scope')||{}).value)||'comun', assignee:((g('task-assignee')||{}).value)||'',
    created_by:me(), created_at:new Date().toISOString() };
  state.tasks.unshift({ ...row, category:project_id, dueDate:row.due_date }); render();
  try { await sb.from('ws_tasks').insert(row); } catch(_){}
}
async function delTask(id){
  state.tasks=state.tasks.filter(t=>t.id!==id); render();
  try { await sb.from('ws_tasks').delete().eq('id',id); } catch(_){}
}

function archivos() {
  const fs = state.selectedProject ? projFiles(state.selectedProject) : state.files;
  return `<div class="flex items-center justify-between mb-3"><h3 class="font-headline font-bold">Archivos</h3><button data-act="upload" data-id="${esc(state.selectedProject||'')}" class="text-[11px] px-3 py-1.5 rounded-lg bg-[#8083ff] text-white font-semibold ${state.uploading?'opacity-50':''}">${state.uploading?'Subiendo…':'⬆ Subir archivo'}</button></div>
    <div class="space-y-1.5">${fs.map(f=>`<a href="${esc(f.url||'#')}" target="_blank" rel="noopener" class="flex items-center gap-3 py-2.5 px-3 rounded-xl hover:bg-[#1c2436]"><span class="w-8 h-8 rounded-lg bg-[#8083ff]/15 flex items-center justify-center">📄</span><div class="flex-1 min-w-0"><p class="text-sm truncate">${esc(f.name)}</p>${f.folder?`<p class="text-[10px] text-[#64748b]">${esc(f.folder)}</p>`:''}</div><span class="text-[#64748b]">↗</span></a>`).join('') || '<p class="text-sm text-[#64748b] text-center py-8">Sin archivos</p>'}</div>`;
}

function avances() {
  const gh=state.gh;
  const tab=(id,label,count)=>`<button data-act="ghtab" data-id="${id}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold transition-colors ${state.ghTab===id?'bg-[#8083ff] text-white':'text-[#94A3B8] hover:text-[#F8FAFC]'}">${label}${count?`<span class="text-[9px] px-1 rounded-full ${state.ghTab===id?'bg-white/25':'bg-[#283449]'}">${count}</span>`:''}</button>`;
  const sB=(s)=>({open:'bg-[#4edea3]/15 text-[#4edea3]',merged:'bg-[#8083ff]/15 text-[#c0c1ff]',closed:'bg-[#64748b]/20 text-[#94A3B8]'}[s]||'bg-[#64748b]/20 text-[#94A3B8]');
  let body;
  if (gh&&gh.error) body=`<div class="flex items-start gap-2 text-[12px] text-[#F59E0B] bg-[#F59E0B]/10 rounded-lg p-3"><span>⚠️</span><div><p class="font-semibold">No se pudo leer GitHub</p><p class="text-[#94A3B8] mt-0.5">${esc(gh.error)}</p></div></div>`;
  else if (state.ghLoading&&!gh) body=`<p class="text-sm text-[#64748b] py-6 text-center">Cargando…</p>`;
  else if (gh){ let list='';
    if(state.ghTab==='commits') list=(gh.commits||[]).map(c=>`<a href="${esc(c.url||'#')}" target="_blank" rel="noopener" class="flex items-center gap-3 py-2 px-2.5 rounded-lg hover:bg-[#1c2436]"><span class="text-[#4edea3]">◆</span><span class="text-sm truncate flex-1">${esc(c.message)}</span><span class="text-[10px] text-[#64748b] font-mono">${esc(c.sha)}</span><span class="text-[10px] text-[#64748b] w-12 text-right">${relTime(c.date)}</span></a>`).join('')||emptyMsg('commits');
    if(state.ghTab==='prs') list=(gh.prs||[]).map(p=>`<a href="${esc(p.url||'#')}" target="_blank" rel="noopener" class="flex items-center gap-3 py-2 px-2.5 rounded-lg hover:bg-[#1c2436]"><span class="text-[#8083ff]">⇄</span><span class="text-sm truncate flex-1">#${p.number} ${esc(p.title)}</span><span class="text-[9px] px-1.5 py-0.5 rounded-full ${sB(p.state)}">${esc(p.state)}</span><span class="text-[10px] text-[#64748b] w-12 text-right">${relTime(p.date)}</span></a>`).join('')||emptyMsg('PRs');
    if(state.ghTab==='issues') list=(gh.issues||[]).map(i=>`<a href="${esc(i.url||'#')}" target="_blank" rel="noopener" class="flex items-center gap-3 py-2 px-2.5 rounded-lg hover:bg-[#1c2436]"><span class="${i.state==='open'?'text-[#4edea3]':'text-[#64748b]'}">◉</span><span class="text-sm truncate flex-1">#${i.number} ${esc(i.title)}</span><span class="text-[9px] px-1.5 py-0.5 rounded-full ${sB(i.state)}">${esc(i.state)}</span><span class="text-[10px] text-[#64748b] w-12 text-right">${relTime(i.date)}</span></a>`).join('')||emptyMsg('issues');
    body=`<div class="inline-flex p-1 rounded-lg bg-[#0d1528] border border-[#283449] gap-1 mb-3">${tab('commits','Commits',gh.commits?gh.commits.length:0)}${tab('prs','PRs',gh.counts?gh.counts.openPrs:0)}${tab('issues','Issues',gh.counts?gh.counts.openIssues:0)}</div><div class="space-y-1.5">${list}</div>`;
  } else body=`<p class="text-sm text-[#64748b] py-6 text-center">Pulsa ⟳ para cargar</p>`;
  return `<div class="space-y-5 fh-rise"><div class="fh-card rounded-2xl p-5"><div class="flex items-center justify-between mb-3"><div class="flex items-center gap-2"><span>🌿</span><h3 class="font-headline font-bold text-sm">Actividad GitHub</h3><span class="text-[10px] text-[#64748b] font-mono truncate max-w-[160px]">${esc(currentRepo())}</span></div><button data-act="gh-reload" class="p-1.5 rounded-lg hover:bg-[#1c2436] text-[#94A3B8] ${state.ghLoading?'spin':''}">⟳</button></div>${body}</div></div>`;
}
function emptyMsg(w){ return `<p class="text-sm text-[#64748b] py-6 text-center">Sin ${w}</p>`; }

function renderLogin() {
  $app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6"><div class="fh-card rounded-3xl p-8 max-w-sm w-full text-center fh-rise">
    <div class="w-16 h-16 rounded-2xl mx-auto mb-5 flex items-center justify-center text-3xl" style="background:linear-gradient(135deg,#2dd4bf,#059669)">💼</div>
    <h1 class="font-headline text-2xl font-bold mb-1">Workspace</h1>
    <p class="text-sm text-[#94A3B8] mb-6">Tus proyectos y avances, conectados a FileHub.</p>
    <button data-act="login" class="w-full py-3 rounded-xl bg-[#F8FAFC] text-[#0b1326] font-semibold mb-3">Entrar con Google</button>
    <a href="${FILEHUB_URL}#dashboard" class="block text-xs text-[#64748b] hover:text-[#94A3B8]">¿Prefieres abrir <span class="underline">FileHub</span> directamente?</a>
  </div></div>`;
}

/* ── eventos ── */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a==='login'){ await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}}); return; }
  if (a==='logout'){ await sb.auth.signOut(); location.reload(); return; }
  if (a==='toggle-sidebar'){ state.sidebar=!state.sidebar; render(); return; }
  if (a==='close-sidebar'){ state.sidebar=false; render(); return; }
  if (a==='copy-url'){ copyUrl(); return; }
  if (a==='share-url'){ shareUrl(); return; }
  if (a==='hide-url'){ state.urlBar=false; render(); return; }
  if (a==='refresh'){ await refreshData(); return; }
  if (a==='welcome-close'){ try{localStorage.setItem('ws_welcome_seen','1');}catch(_){} render(); return; }
  if (a==='notif-toggle'){ state.notifOpen=!state.notifOpen; render(); return; }
  if (a==='notif-close'){ state.notifOpen=false; render(); return; }
  if (a==='sec'){ state.section=id; state.sidebar=false; state.notifOpen=false; render(); if(state.section==='avances'&&!state.gh) loadGithub(); return; }
  if (a==='proj'){ state.selectedProject=id||null; state.section='overview'; state.sidebar=false; state.notifOpen=false; if(state.gh){state.gh=null;} render(); return; }
  if (a==='cal-prev'){ if(state.cal.m===0){state.cal.m=11;state.cal.y--;}else state.cal.m--; render(); return; }
  if (a==='cal-next'){ if(state.cal.m===11){state.cal.m=0;state.cal.y++;}else state.cal.m++; render(); return; }
  if (a==='ghtab'){ state.ghTab=id; render(); return; }
  if (a==='gh-reload'){ loadGithub(); return; }
  if (a==='add-note'){ await addNote(id); return; }
  if (a==='toggle-task'){ await toggleTask(id); return; }
  if (a==='add-task'){ await addTask(id); return; }
  if (a==='add-task2'){ await addTaskFull(); return; }
  if (a==='del-task'){ await delTask(id); return; }
  if (a==='tfilter'){ state.taskFilter=id; render(); return; }
  if (a==='tdone'){ state.taskDone=id; render(); return; }
  if (a==='stage'){ await setStage(id, el.dataset.stage); return; }
  if (a==='add-mtg'){ await addMeeting(id); return; }
  if (a==='upload'){ pickFile(id||state.selectedProject); return; }
});
document.addEventListener('change', async (e) => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  if (el.dataset.act==='proj-progress') await updateProject(el.dataset.id,{progress:Number(el.value)});
  if (el.dataset.act==='proj-status') await updateProject(el.dataset.id,{status:el.value});
});
document.addEventListener('input', (e) => {
  const el=e.target.closest('[data-act="proj-progress"]'); if(!el) return;
  const lbl=document.getElementById('prog-label'); if(lbl) lbl.textContent=el.value+'%';
});
document.addEventListener('keydown', (e) => {
  if (e.key!=='Enter') return;
  if (e.target.id==='task-input') { if(document.getElementById('task-scope')) addTaskFull(); else addTask(state.selectedProject); }
  if (e.target.id==='mtg-title') addMeeting(state.selectedProject);
});

/* ── boot ── */
const ALLOWED = new Set(TEAM.map(m=>m.email));
function renderDenied(email){
  $app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6"><div class="fh-card rounded-3xl p-8 max-w-sm w-full text-center">
    <div class="text-4xl mb-3">🔒</div>
    <h1 class="font-headline text-xl font-bold mb-1">Espacio privado</h1>
    <p class="text-sm text-[#94A3B8] mb-4">Este workspace es solo para <b>Carlos</b> y <b>Raquel</b>.<br>La cuenta <b>${esc(email||'')}</b> no tiene acceso.</p>
    <button data-act="logout" class="w-full py-2.5 rounded-xl bg-[#131b2e] border border-[#283449] text-[#F8FAFC] text-sm font-semibold">Cambiar de cuenta</button>
  </div></div>`;
}
(async function boot(){
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) renderLogin();
    else if (!ALLOWED.has((session.user.email||'').toLowerCase())) renderDenied(session.user.email);
    else { state.user=session.user; await loadAll(); render(); subscribeRealtime(); }
  } catch(e){ $app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6 text-center text-[#94A3B8]"><div><p class="text-lg font-headline">No se pudo cargar</p><p class="text-sm mt-2">${esc(String(e&&e.message||e))}</p></div></div>`; }
  sb.auth.onAuthStateChange((_e,sess)=>{ if(sess&&!state.user){ if(!ALLOWED.has((sess.user.email||'').toLowerCase())){renderDenied(sess.user.email);return;} state.user=sess.user; loadAll().then(()=>{render(); subscribeRealtime();});} else if(!sess&&state.user){state.user=null; renderLogin();} });
})();

if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
